name: RiskeloUS
options:
  bundleIdPrefix: com.oulhen
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    # The number people read on the App Store, and the one that counts
    # uploads. The first moves only on a real release; the second climbs with
    # every submission to App Store Connect, which refuses the same one twice.
    #
    # This is a new app record, not an update to the French one: it starts
    # over at 1.0 / 1, whatever version the original has reached.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    # Set here rather than in Xcode: "xcodegen generate" rewrites the project,
    # and a team filled in by hand would vanish on the next regeneration.
    DEVELOPMENT_TEAM: 38DQ8FW23J
    CODE_SIGN_STYLE: Automatic

targets:
  RiskeloUS:
    type: application
    # One target for all three machines: the board is drawn in relative
    # coordinates, it has no opinion about screen size.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
      # Questions are resources, not code: a thousand lines of text have no
      # business inside a Swift file.
      - path: Resources/Questions
      # The fake App Store, visible in Xcode so prices can be changed — but
      # kept out of every build phase: it does not ship inside the bundle,
      # and has nothing to do there.
      - path: Resources/RiskeloUS.storekit
        buildPhase: none
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Riskelo US
        # Both numbers point back to the settings above rather than being
        # copied here. XcodeGen rewrites this plist, and its defaults are
        # "1.0" and "1": without these two lines, raising the build in the
        # settings would change nothing in what the App Store received.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # No encryption of our own: the declaration sits here once and for
        # all rather than being answered by hand at every upload.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        # A board is looked at both ways up, on all three machines.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Two-device play goes over the local network. Without these two
        # entries the system refuses it in silence: the devices never see
        # each other and nothing explains why.
        #
        # The service name is "riskelo-us", not the French app's
        # "riskelo-jeu" — deliberately. The two apps ship different question
        # packs, so a French device and an American one must not find each
        # other and sit down to a table they cannot both play.
        NSLocalNetworkUsageDescription: >-
          Riskelo US uses it to find the other device and play a two-player game.
        NSBonjourServices:
          - _riskelo-us._tcp
          - _riskelo-us._udp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oulhen.riskelo.us
        # No space in the product name — that is the executable's name. The
        # space belongs in CFBundleDisplayName above, which is what people
        # read under the icon.
        PRODUCT_NAME: RiskeloUS
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        # The icon is generated by "outils/icone.swift" — the eleven images
        # in the catalogue are not retouched by hand, they are remade.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # The sandbox, for the Mac only — iOS already has it by default, and
        # these keys do not apply there. Without this file the Mac App Store
        # refuses the upload; with it but without its two network keys, the
        # link between devices would go quiet. See
        # soumission/FICHE-DE-SOUMISSION.md, section 9.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Resources/RiskeloUS-mac.entitlements

  RiskeloUSTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests
    dependencies:
      - target: RiskeloUS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oulhen.riskelo.us.tests
        GENERATE_INFOPLIST_FILE: YES
      # One target for two systems, but an app bundle is not shaped the same
      # on both: the executable sits at the root on iOS, under
      # "Contents/MacOS" on the Mac. The generated path is the iOS one, so
      # the tests never ran on the Mac — the one machine where they can run
      # without a simulator.
      configs:
        Debug:
          TEST_HOST[sdk=macosx*]: "$(BUILT_PRODUCTS_DIR)/RiskeloUS.app/Contents/MacOS/RiskeloUS"
          BUNDLE_LOADER[sdk=macosx*]: "$(TEST_HOST)"
        Release:
          TEST_HOST[sdk=macosx*]: "$(BUILT_PRODUCTS_DIR)/RiskeloUS.app/Contents/MacOS/RiskeloUS"
          BUNDLE_LOADER[sdk=macosx*]: "$(TEST_HOST)"

schemes:
  RiskeloUS:
    build:
      targets:
        RiskeloUS: all
        RiskeloUSTests: [test]
    # The desktop App Store, attached to the scheme: purchases can be tried
    # without creating anything at Apple, and nothing is charged.
    #
    # The path is counted from "RiskeloUS.xcodeproj/xcshareddata", not from
    # the schemes folder: two levels up and you are at the project root.
    # XcodeGen adds those two levels itself, so nothing goes in front.
    #
    # One "../" too many and Xcode looks for the file on the Desktop, one
    # notch above the project — which is what it said, word for word.
    run:
      storeKitConfiguration: Resources/RiskeloUS.storekit
    test:
      targets: [RiskeloUSTests]
